<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Lumenu — Digital Menu Board</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/fallback.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
  </div>

  <!-- Full-bleed video layer: covers the ENTIRE viewport edge-to-edge
       (object-fit: cover, cropping as needed) — no letterbox/pillarbox bars -->
  <video id="menu-video"
         playsinline
         webkit-playsinline
         muted
         autoplay
         loop
         preload="auto"
         data-src=""
         poster="assets/fallback.svg">
  </video>

  <!-- Full-bleed layout background (image/color backgrounds from a layout) -->
  <div id="layout-background" class="hidden"></div>

  <!-- 16:9 safe-area canvas (centered + scaled): holds text overlays so they
       never get pushed off-screen on non-16:9 displays -->
  <div id="app">

    <!-- Text Overlay Layer -->
    <div id="overlay-layer"></div>

    <!-- Failsafe Layer (shown when no data ever synced) -->
    <div id="failsafe-layer" class="hidden">
      <div class="logo">🍽 Lumenu</div>
      <div class="tagline">Menu Coming Soon</div>
    </div>

  </div>

  <!-- Fullscreen affordance (owner-facing; fades out once fullscreen is active) -->
  <button id="fullscreen-button" type="button" title="Enter fullscreen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <span>Enter Fullscreen</span>
  </button>

  <!-- Mode Indicator (subtle dot, bottom-right, owner-facing) -->
  <div id="mode-indicator" class="online"></div>

  <!-- Connectivity Indicator (subtle, top-right) -->
  <div id="connectivity-indicator">
    <span id="conn-dot" class="dot green"></span>
    <span id="conn-label" class="label">LIVE</span>
  </div>

  <!-- Debug Bar (hidden by default, press 'd' to toggle) -->
  <div id="debug-bar" class="hidden">
    <span><span class="dbg-label">Mode:</span> <span id="debug-mode">—</span></span>
    <span><span class="dbg-label">Online:</span> <span id="debug-online">—</span></span>
    <span><span class="dbg-label">Data:</span> <span id="debug-data">—</span></span>
    <span><span class="dbg-label">Render:</span> <span id="debug-render">—</span></span>
    <button class="dbg-btn" onclick="__toggleOffline()">Toggle Offline</button>
    <button class="dbg-btn" onclick="__simulateLayout()">Load Layout Demo</button>
    <button class="dbg-btn" onclick="__simulateLegacy()">Load Legacy Demo</button>
    <button class="dbg-btn" onclick="__toggleDebug()">Hide Debug</button>
  </div>

  <script src="layout-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
